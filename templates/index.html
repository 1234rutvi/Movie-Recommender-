<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Recommendation System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>🎬 Movie Recommendation System</h1>

    <!-- Movie selection form -->
    <form method="POST">
        <select name="movie" required>
            <option value="" disabled {% if not selected_movie %}selected{% endif %}>
                Select a movie
            </option>
            {% for movie in movie_names %}
                <option value="{{ movie }}"
                    {% if movie == selected_movie %}selected{% endif %}>
                    {{ movie }}
                </option>
            {% endfor %}
        </select>
        <button type="submit">Recommend</button>
    </form>

    <!-- Recommendations -->
    {% if recommendations %}
    <div class="results">
        {% for name, poster in recommendations %}
        <div class="card">
            <img 
                src="{{ poster }}" 
                alt="{{ name }}"
                onerror="this.src='https://via.placeholder.com/200x300?text=No+Poster'">
            <p>{{ name }}</p>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>

</body>
</html>
